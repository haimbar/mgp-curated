[build-system]
requires = ["hatchling >= 1.26", "requests", "pandas"]
build-backend = "hatchling.build"

[project]
name = "pymathgene"
version = "0.0.1"
authors = [
  { name="Haim Bar", email="haim.bar@uconn.edu" },
]
description = "Create a database from the mathgenealogy.org data"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"
